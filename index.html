    // Precompute normalized fields for each product for speed
    let productSearchCache = [];

    function buildSearchCache() {
      productSearchCache = allProducts.map(item => ({
        id: item.id,
        norm_n: normalize(item.n),
        norm_v: normalize(item.v),
        norm_s: normalize(item.s),
        norm_q: normalize(item.q),
        norm_c: normalize(item.c),
        chosung_n: getChosung(item.n.replace(/\s+/g, '')),
        original_c: item.c
      }));
    }

    // Normalized synonym groups (built once)
    let SYN_N = null;
    let cacheById = null;
    function synGroups() {
      if (!SYN_N) SYN_N = SYN.map(g => [...new Set(g.map(t => normalize(t)).filter(t => t.length >= 1))]);
      return SYN_N;
    }
    // A term may be replaced inside a token only if it is safe:
    // exact match, or a Hangul term of 2+ chars, or a Latin term of 4+ chars.
    function termHits(token, term) {
      if (token === term) return true;
      if (!token.includes(term)) return false;
      return /[가-힣]/.test(term) ? term.length >= 2 : term.length >= 4;
    }
    const variantMemo = new Map();
    function tokenVariants(tok) {
      if (variantMemo.has(tok)) return variantMemo.get(tok);
      const out = new Set([tok]);
      for (const g of synGroups()) {
        for (const term of g) {
          if (!termHits(tok, term)) continue;
          for (const alt of g) if (alt !== term && alt.length >= 2) out.add(tok.split(term).join(alt));
        }
      }
      const arr = [...out];
      variantMemo.set(tok, arr);
      return arr;
    }

    function smartSearch(query, item) {
      if (!cacheById) cacheById = new Map(productSearchCache.map(c => [c.id, c]));
      const cache = cacheById.get(item.id);
      if (!cache) return false;
      const tokens = query.split(/\s+/).filter(t => t);
      if (tokens.length === 0) return true;
      const fields = [cache.norm_n, cache.norm_v, cache.norm_s, cache.norm_q, cache.norm_c];
      return tokens.every(token => {
        if (/^[ㄱ-ㅎ]+$/.test(token)) return cache.chosung_n.includes(token);
        const nt = normalize(token);
        if (!nt) return true;
        return tokenVariants(nt).some(v => fields.some(f => f.includes(v)));
      });
    }

    function onSearch(e) {
      clearTimeout(searchTimeout);
      searchQuery = e.target.value.trim();
      searchTimeout = setTimeout(() => {
        displayedCount = 0;
        applyFiltersAndSort({ keepTop: true });
      }, 150);
    }

    function onFilterClick(e) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      displayedCount = 0;
      applyFiltersAndSort({ keepTop: true });
    }

    // 검색어 + 필터 칩 조건
    function passesBase(item) {
      if (searchQuery && !smartSearch(searchQuery, item)) return false;
      if (currentFilter === 'new' && !item.new) return false;
      if (currentFilter === 'out' && !item.out) return false;
      if (currentFilter === 'cart' && !cart[item.id]) return false;
      return true;
    }

    // 목록을 다시 그린 뒤, 스크롤이 목록 위쪽을 지나가 있으면 목록 맨 위가 고정 메뉴 바로 아래에 오게 맞춤
    function keepListTop() {
      const ctrl = document.querySelector('.controls');
      const anchor = document.getElementById('resultCount');
      if (!ctrl || !anchor) return;
      const y = window.scrollY || window.pageYOffset || 0;
      const top = anchor.getBoundingClientRect().top + y - ctrl.offsetHeight - 8;
      if (y > top) window.scrollTo({ top: Math.max(0, Math.round(top)), behavior: 'instant' });
    }

    function applyFiltersAndSort(opts) {
      // Filter
      filteredProducts = allProducts.filter(item => {
        if (!passesBase(item)) return false;
        // Category filter (비어 있으면 전체)
        return selectedCats.size === 0 || selectedCats.has(item.c);
      });

      // Sort
      if (currentSort === 'price-asc') {
        filteredProducts.sort((a, b) => a.p - b.p);
      } else if (currentSort === 'price-desc') {
        filteredProducts.sort((a, b) => b.p - a.p);
      } else if (currentSort === 'name') {
        filteredProducts.sort((a, b) => (a.n || '').localeCompare(b.n || '', 'ko'));
      } else if (currentSort === 'category') {
        filteredProducts.sort((a, b) => {
          const catA = allCategories.indexOf(a.c);
          const catB = allCategories.indexOf(b.c);
          if (catA !== catB) return catA - catB;
          // Within same category: 영외 (out) items first, then rest in original order
          if ((a.out ? 1 : 0) !== (b.out ? 1 : 0)) {
            return (b.out ? 1 : 0) - (a.out ? 1 : 0);
          }
          return 0; // Keep original order for items in same category
        });
      }

      // Render
      renderProducts();
      updateCartBar();
      if (opts && opts.keepTop) keepListTop();
    }


    // ---- 상품 사진: 분류별 묶음 파일(thumbs/<분류번호>.json)을 필요할 때만 불러옴 ----
    const thumbChunks = {};   // 분류번호 -> {id: dataURL} | 'loading' | 'fail'
    function thumbKey(c) { return DATA_CATS.indexOf(c); }
    function setThumb(el, src) {
      el.dataset.done = '1';
      if (!src) { el.classList.add('noimg'); return; }
      const img = new Image();
      img.className = 'thumb'; img.alt = ''; img.decoding = 'async';
      img.onerror = () => { img.remove(); el.classList.add('noimg'); };
      img.src = src;
      el.appendChild(img);
    }
    function fillThumbs() {
      document.querySelectorAll('.thumb-wrap:not([data-done])').forEach(el => {
        const k = thumbKey(el.dataset.c);
        const ch = thumbChunks[k];
        if (ch === 'loading') return;
        if (ch === 'fail') return setThumb(el, 'https://www.welfare.mil.kr/shop/imgView.do?p_code=' + el.dataset.id + '&type=1');
        if (ch) return setThumb(el, ch[el.dataset.id]);
        thumbChunks[k] = 'loading';
        decryptFile('data/t' + k + '.bin')
          .then(m => { thumbChunks[k] = m; })
          .catch(() => { thumbChunks[k] = 'fail'; })
          .finally(fillThumbs);
      });
    }

    function renderProducts() {
      const list = document.getElementById('productList');
      list.innerHTML = '';

      const limit = Math.min(displayedCount + ITEMS_PER_PAGE, filteredProducts.length);
      const batch = filteredProducts.slice(0, limit);

      let lastCategory = null;
      const categoryCounts = {};
      filteredProducts.forEach(item => {
        categoryCounts[item.c] = (categoryCounts[item.c] || 0) + 1;
      });

      batch.forEach(item => {
        // Add category header if sorting by category and category changed
        if (currentSort === 'category' && item.c !== lastCategory) {
          lastCategory = item.c;
          const header = document.createElement('div');
          header.className = 'category-header';
          header.textContent = `${item.c} · ${categoryCounts[item.c]}개`;
          list.appendChild(header);
        }

        const qty = cart[item.id] || 0;
        const card = document.createElement('div');
        card.className = 'card' + (qty > 0 ? ' in-cart' : '');
        card.id = 'card-' + item.id;

        const badges = [];
        if (item.new) badges.push('<span class="badge badge-new">신규</span>');
        if (item.out) badges.push('<span class="badge badge-out">영외</span>');
        const bi = boxInfo(item);
        if (bi) badges.push('<span class="badge badge-box">박스 주문 가능</span>');

        // Build meta line with optional category
        let metaLine = escapeHtml(item.v) + ' · ' + escapeHtml(item.s);
        if (currentSort !== 'category') {
          metaLine = metaLine + ' · ' + escapeHtml(item.c);
        }

        const shownName = (item.n || '').replace(/^\((영외|동계)\)\s*/, '');
        card.innerHTML = `
          <div class="c-row">
            <div class="thumb-wrap" data-id="${item.id}" data-c="${escapeHtml(item.c)}" style="cursor:pointer;" onclick="openZoom('${item.id}')"></div>
            <div class="c-body">
              <div class="c-head">
                <div class="card-name" style="cursor:pointer;" onclick="openZoom('${item.id}')">${escapeHtml(shownName)}</div>
                <div class="search-links">${searchIconsHtml(item)}</div>
              </div>
              <div class="card-meta">${badges.join('')}<span>${metaLine}</span></div>
              <div class="c-bottom">
                <div class="card-price">${item.p.toLocaleString('ko-KR')}원</div>
                <div class="card-qty">
                  <button class="qty-btn" onclick="updateQty('${item.id}', -1)" aria-label="빼기">−</button>
                  <div class="qty-display">${qtyLabel(item.id)}</div>
                  <button class="qty-btn" onclick="updateQty('${item.id}', 1)" aria-label="담기">+</button>
                </div>
              </div>
              ${bi ? `<div class="box-est" ${isBox(item.id) ? '' : 'hidden'}>${boxEstText(item.id)}</div>
              <div class="c-tools">${unitToggleHtml(item.id)}</div>` : ''}
            </div>
          </div>
        `;
        list.appendChild(card);
      });
      fillThumbs();

      // Result count
      const count = filteredProducts.length;
      document.getElementById('resultCount').textContent = count > 0 ? `${count}개 상품` : '검색 결과 없음';

      // Load more button
      const moreBtn = document.getElementById('loadMoreBtn');
      if (limit < filteredProducts.length) {
        moreBtn.style.display = 'block';
        moreBtn.textContent = `더 보기 (${limit}/${count})`;
        moreBtn.onclick = () => {
          displayedCount = limit;
          renderProducts();
        };
      } else {
        moreBtn.style.display = 'none';
      }

      displayedCount = limit;
    }

    // ---------- 겹침 화면 스택 + 뒤로가기(History API) ----------
    // 시트·확대·확인창이 열리면 스택에 쌓고 pushState 해요.
    // 뒤로가기(popstate)는 맨 위 화면 하나만 닫아요. 화면 안의 버튼으로 닫을 땐 history.back()으로 항목을 하나 되돌려요.
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (_) {}
    const overlayStack = [];
    let ignorePops = 0;
    const overlayHiders = {};   // name -> 화면만 닫는 함수 (history는 건드리지 않음)
    function pushOverlay(name) {
      if (overlayStack.includes(name)) return;
      overlayStack.push(name);
      try { history.pushState({ hmOverlay: name }, ''); } catch (_) {}
    }
    function consumeOverlayEntry(delay) {
      const go = () => {
        let has = false;
        try { has = !!(history.state && history.state.hmOverlay); } catch (_) {}
        if (!has) return;
        ignorePops++;
        history.back();
      };
      if (delay) setTimeout(go, delay); else go();
    }
    // UI로 닫기: 스택에서 빼고 history 항목 하나를 소비
    function popOverlay(name, delay) {
      const i = overlayStack.lastIndexOf(name);
      if (i < 0) return;
      overlayStack.splice(i, 1);
      consumeOverlayEntry(delay);
    }
    window.addEventListener('popstate', () => {
      if (ignorePops > 0) { ignorePops--; return; }
      const name = overlayStack.pop();
      if (!name) return;
      const hide = overlayHiders[name];
      if (hide) hide();
    });

    // ---------- 본문 스크롤 잠금 (시트·팝업이 열려 있는 동안) ----------
    const scrollLocks = new Set();
    let lockedY = 0;
    function lockBody(key) {
      if (scrollLocks.size === 0) {
        lockedY = window.scrollY || window.pageYOffset || 0;
        document.body.style.overflow = 'hidden';
      }
      scrollLocks.add(key);
    }
    function unlockBody(key) {
      if (!scrollLocks.delete(key)) return;
      if (scrollLocks.size === 0) {
        document.body.style.overflow = '';
        if ((window.scrollY || 0) !== lockedY) window.scrollTo({ top: lockedY, behavior: 'instant' });
      }
    }

    // ---------- 박스 주문 (소주·맥주) ----------
    const BOX_SOJU_RE = /참이슬|처음처럼|진로|좋은데이|새로|청풍|잎새주|선양|참소주|시원|대선|한라산|소주/;
    const BOX_BEER_RE = /카스|테라|하이트|켈리|클라우드|아사히|하이네켄|삿포로|에비스|코젤|칭따오|버드와이저|호가든|기네스|맥주|라거|필스너|크롬바커/;
    const boxCache = new Map();
    // 박스 주문이 가능한 상품이면 {size, label}, 아니면 null (예상치)
    function boxInfo(item) {
      if (!item) return null;
      if (boxCache.has(item.id)) return boxCache.get(item.id);
      let result = null;
      if (item.c === '주류' && item.p < 3000) {
        const name = item.n || '';
        const text = name + ' ' + (item.s || '');
        // 맥주 이름을 먼저 봐요 (예: 하이트진로 맥주가 '진로'에 걸리지 않게)
        const kind = BOX_BEER_RE.test(name) ? '맥주' : BOX_SOJU_RE.test(name) ? '소주' : null;
        const m = text.match(/(\d+(?:\.\d+)?)\s*ml/i);
        const ml = m ? parseFloat(m[1]) : null;
        if (kind && ml != null) {
          for (const rule of BOX_RULES) {
            if (rule.kind !== kind) continue;
            if (rule.pattern && !rule.pattern.test(text)) continue;
            if (Array.isArray(rule.ml)) {
              if (ml < rule.ml[0] || ml > rule.ml[1]) continue;
            } else if (typeof rule.ml === 'number') {
              if (ml !== rule.ml) continue;
            }
            result = { size: rule.size, label: rule.label };
            break;
          }
        }
      }
      boxCache.set(item.id, result);
      return result;
    }
    function isBox(id) { return !!(boxMode[id] && boxInfo(itemById.get(id))); }
    // 한 번 담을 때의 낱개 수 (낱개 1, 박스는 박스 크기)
    function unitCount(id) { return isBox(id) ? boxInfo(itemById.get(id)).size : 1; }
    function qtyLabel(id) {
      const q = cart[id] || 0;
      return isBox(id) && q > 0 ? q + '박스' : String(q);
    }
    function boxEstText(id) {
      const item = itemById.get(id);
      const bi = boxInfo(item);
      if (!bi) return '';
      const q = cart[id] || 0;
      if (q > 0) return `= ${q * bi.size}${bi.label} · ${(q * bi.size * item.p).toLocaleString('ko-KR')}원 (예상)`;
      return `1박스 = ${bi.size}${bi.label} · ${(bi.size * item.p).toLocaleString('ko-KR')}원 (예상)`;
    }
    function unitToggleHtml(id) {
      const bi = boxInfo(itemById.get(id));
      if (!bi) return '';
      const box = isBox(id);
      return `<div class="unit-toggle" role="group" aria-label="주문 단위">` +
        `<button type="button" class="unit-opt${box ? '' : ' on'}" data-box="0" aria-pressed="${!box}" onclick="setUnit('${id}', false)">낱개</button>` +
        `<button type="button" class="unit-opt${box ? ' on' : ''}" data-box="1" aria-pressed="${box}" onclick="setUnit('${id}', true)">박스(${bi.size}${escapeHtml(bi.label)})</button>` +
        `</div>`;
    }
    function setUnit(id, box) {
      const item = itemById.get(id);
      if (!item) return;
      if (box && !boxInfo(item)) return;
      if (box) boxMode[id] = true; else delete boxMode[id];
      saveToStorage('hm_box', boxMode);
      refreshCard(id);
      updateCartBar();
      if (zoomId === id && document.getElementById('zoomModal').classList.contains('open')) renderZoomQty(id);
      if (document.getElementById('cartSheet').classList.contains('open')) renderCartSheet();
    }

    // ---------- 장바구니 계산 ----------
    function cartLines() {
      const out = [];
      Object.keys(cart).forEach(id => {
        const item = itemById.get(id);
        const qty = cart[id];
        if (!item || !(qty > 0)) return;
        const box = isBox(id);
        const bi = boxInfo(item);
        const per = box ? bi.size : 1;
        out.push({
          id, item, qty, box, per,
          label: bi ? bi.label : '',
          pieces: qty * per,
          total: item.p * qty * per,
          checked: !cartUnchecked.has(id)
        });
      });
      out.sort((a, b) => {
        const catA = allCategories.indexOf(a.item.c);
        const catB = allCategories.indexOf(b.item.c);
        if (catA !== catB) return catA - catB;
        return (a.item.n || '').localeCompare(b.item.n || '', 'ko');
      });
      return out;
    }

    // 낱개/박스 단위별 수량 합계 (박스 안 병 수는 섞지 않아요)
    function qtyParts(lines) {
      let ea = 0, box = 0;
      lines.forEach(l => { if (l.box) box += l.qty; else ea += l.qty; });
      return { ea, box };
    }
    function qtyText(ea, box) {
      const parts = [];
      if (ea > 0) parts.push(ea + '개');
      if (box > 0) parts.push(box + '박스');
      return parts.length ? parts.join(' + ') : '0개';
    }
    // 박스 안 낱개 수 문구 (예: "40병"), 단위가 섞이면 "개"
    function boxInnerText(lines) {
      const by = {};
      lines.forEach(l => { if (l.box) by[l.label || '개'] = (by[l.label || '개'] || 0) + l.pieces; });
      const keys = Object.keys(by);
      if (keys.length === 0) return '';
      if (keys.length === 1) return by[keys[0]] + keys[0];
      return keys.reduce((a, k) => a + by[k], 0) + '개';
    }

    function refreshCard(id) {
      const card = document.getElementById('card-' + id);
      if (!card) return;
      const qty = cart[id] || 0;
      card.classList.toggle('in-cart', qty > 0);
      const disp = card.querySelector('.qty-display');
      if (disp) disp.textContent = qtyLabel(id);
      const box = isBox(id);
      const est = card.querySelector('.box-est');
      if (est) { est.textContent = boxEstText(id); est.hidden = !box; }
      card.querySelectorAll('.unit-opt').forEach(b => {
        const on = (b.dataset.box === '1') === box;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });
    }
    function refreshAllCards() {
      document.querySelectorAll('.card').forEach(c => refreshCard(c.id.slice(5)));
    }
    // 장바구니가 한꺼번에 바뀐 뒤 화면을 맞춤
    function afterCartBulkChange() {
      if (currentFilter === 'cart') applyFiltersAndSort();
      else refreshAllCards();
      updateCartBar();
      if (document.getElementById('cartSheet').classList.contains('open')) renderCartSheet();
      if (document.getElementById('zoomModal').classList.contains('open') && zoomId) renderZoomQty(zoomId);
    }

    function updateQty(id, delta) {
      const curr = cart[id] || 0;
      const newQty = Math.max(0, curr + delta);
      const wasAdded = curr === 0 && newQty > 0;
      if (newQty === 0) {
        delete cart[id];
        if (cartUnchecked.delete(id)) saveToStorage('hm_cart_unchecked', [...cartUnchecked]);
      } else {
        cart[id] = newQty;
        // 새로 담은 상품은 항상 체크된 상태
        if (wasAdded && cartUnchecked.delete(id)) saveToStorage('hm_cart_unchecked', [...cartUnchecked]);
      }
      saveToStorage('cart', cart);
      refreshCard(id);
      updateCartBar();
      if (wasAdded) {
        const btn = document.getElementById('floatingCartBtn');
        btn.classList.remove('bounce');
        void btn.offsetWidth;
        btn.classList.add('bounce');
      }
      if (currentFilter === 'cart') {
        applyFiltersAndSort();
      }
      if (zoomId === id && document.getElementById('zoomModal').classList.contains('open')) renderZoomQty(id);
      // 장바구니 화면이 열려 있으면 즉시 다시 그림
      if (document.getElementById('cartSheet').classList.contains('open')) {
        renderCartSheet();
      }
    }

    function updateCartBar() {
      const lines = cartLines();
      const kinds = lines.length;   // 배지는 병 수가 아니라 담은 상품 종류 수
      const total = lines.reduce((a, l) => a + (l.checked ? l.total : 0), 0);
      const badge = document.getElementById('cartBadge');
      const pill = document.getElementById('cartPill');
      const fab = document.getElementById('floatingCartBtn');
      if (kinds > 0) {
        const qp = qtyParts(lines);
        const tip = `장바구니 ${kinds}종 · ${qtyText(qp.ea, qp.box)}`;
        fab.title = tip; fab.setAttribute('aria-label', tip);
        badge.textContent = kinds > 99 ? '99+' : kinds;
        badge.classList.add('show');
        pill.textContent = total.toLocaleString('ko-KR') + '원';
        pill.classList.add('show');
      } else {
        fab.title = '장바구니'; fab.setAttribute('aria-label', '장바구니');
        badge.classList.remove('show');
        pill.classList.remove('show');
      }
    }

    function getThumbSrc(item) {
      const k = thumbKey(item.c);
      const ch = thumbChunks[k];
      if (ch && ch !== 'loading' && ch !== 'fail') {
        return ch[item.id];
      }
      return null;
    }

    function openCart() {
      if (document.getElementById('cartSheet').classList.contains('open')) return;
      renderCartSheet();
      document.getElementById('cartSheet').classList.add('open');
      lockBody('cart');
      pushOverlay('cart');
      const sc = document.getElementById('cartScroll');
      if (sc) sc.scrollTop = 0;
    }

    function hideCart() {
      document.getElementById('cartSheet').classList.remove('open');
      unlockBody('cart');
    }
    function closeCart(delay) {
      hideCart();
      popOverlay('cart', typeof delay === 'number' ? delay : 0);
    }
    overlayHiders.cart = hideCart;

    // ---------- 비교 사이트 아이콘 (각 사이트 파비콘) ----------
    function searchIconsHtml(item) {
      const q = encodeURIComponent(item.q + (item.s && /\d/.test(item.s) ? ' ' + item.s : ''));
      const sites = [];
      if (item.c === '화장품·뷰티' || item.c === '헤어·바디') {
        sites.push({ domain: 'oliveyoung.co.kr', url: 'https://www.oliveyoung.co.kr/store/search/getSearchMain.do?query=' + q, label: '올리브영에서 찾기', letter: 'O' });
      }
      sites.push({ domain: 'naver.com', url: 'https://search.shopping.naver.com/search/all?query=' + q, label: '네이버쇼핑에서 찾기', letter: 'N' });
      sites.push({ domain: 'gmarket.co.kr', url: 'https://browse.gmarket.co.kr/search?keyword=' + q, label: 'G마켓에서 찾기', letter: 'G' });
      return sites.map(s =>
        `<a class="search-icon" href="${s.url}" target="_blank" rel="noopener" aria-label="${s.label}" title="${s.label}">` +
        `<img src="https://www.google.com/s2/favicons?domain=${s.domain}&sz=64" alt="" loading="lazy" width="20" height="20" ` +
        `onerror="this.style.display='none';this.parentNode.classList.add('fail')">` +
        `<span class="si-fb" aria-hidden="true">${s.letter}</span></a>`
      ).join('');
    }

    // ---------- 확대 보기 ----------
    let zoomId = null;
    function openZoom(id) {
      const item = itemById.get(id);
      if (!item) return;
      zoomId = id;
      const modal = document.getElementById('zoomModal');

      // Set item details
      document.getElementById('zoomName').textContent = item.n;

      const badges = [];
      if (item.new) badges.push('<span class="badge badge-new">신규</span>');
      if (item.out) badges.push('<span class="badge badge-out">영외</span>');
      if (boxInfo(item)) badges.push('<span class="badge badge-box">박스 주문 가능</span>');
      document.getElementById('zoomBadges').innerHTML = badges.join('');

      const metaLine = escapeHtml(item.v) + ' · ' + escapeHtml(item.s) + ' · ' + escapeHtml(item.c);
      document.getElementById('zoomMeta').innerHTML = metaLine;

      document.getElementById('zoomPrice').textContent = item.p.toLocaleString('ko-KR') + '원';

      renderZoomQty(id);

      document.getElementById('zoomLinks').innerHTML = '<div class="search-links">' + searchIconsHtml(item) + '</div>';

      // Set image
      const imageArea = document.getElementById('zoomImageArea');
      imageArea.innerHTML = '';
      const thumbSrc = getThumbSrc(item);
      if (thumbSrc) {
        const img = document.createElement('img');
        img.src = thumbSrc;
        imageArea.appendChild(img);
      } else {
        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'thumb-wrap';
        thumbWrap.dataset.id = item.id;
        thumbWrap.dataset.c = item.c;
        imageArea.appendChild(thumbWrap);
      }

      modal.classList.add('open');
      lockBody('zoom');
      pushOverlay('zoom');

      // Try to load full-size image
      const fullImg = new Image();
      fullImg.referrerPolicy = 'no-referrer';
      fullImg.onload = () => {
        if (zoomId !== id) return;
        imageArea.innerHTML = '';
        imageArea.appendChild(fullImg);
      };
      fullImg.src = 'https://www.welfare.mil.kr/shop/imgView.do?p_code=' + item.id + '&type=1';

      // Fill missing thumbnails in modal
      if (!thumbSrc) {
        setTimeout(fillThumbs, 0);
      }
    }

    function renderZoomQty(id) {
      const item = itemById.get(id);
      if (!item) return;
      const bi = boxInfo(item);
      let html = '';
      if (bi) html += `<div>${unitToggleHtml(id)}</div>`;
      html += `<div class="zoom-step">
        <button class="qty-btn" onclick="updateQtyZoom('${id}', -1)" style="width:36px;height:36px;" aria-label="빼기">−</button>
        <div class="qty-display" id="zoomQtyDisplay">${qtyLabel(id)}</div>
        <button class="qty-btn" onclick="updateQtyZoom('${id}', 1)" style="width:36px;height:36px;" aria-label="담기">+</button>
      </div>`;
      if (bi && isBox(id)) html += `<div class="box-est">${boxEstText(id)}</div>`;
      document.getElementById('zoomQty').innerHTML = html;
    }

    function hideZoom() {
      document.getElementById('zoomModal').classList.remove('open');
      unlockBody('zoom');
    }
    function closeZoom() {
      hideZoom();
      popOverlay('zoom');
    }
    overlayHiders.zoom = hideZoom;

    function updateQtyZoom(id, delta) {
      updateQty(id, delta);   // 확대 화면은 updateQty 안에서 다시 그려져요
    }

    // ---------- 장바구니 시트 ----------
    function renderCartSheet() {
      const scrollEl = document.getElementById('cartScroll');
      const prevTop = scrollEl ? scrollEl.scrollTop : 0;
      const container = document.getElementById('cartItems');
      const selRow = document.getElementById('cartSelectAllRow');
      container.innerHTML = '';
      selRow.innerHTML = '';
      const lines = cartLines();

      if (lines.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:var(--color-text-secondary);padding:20px;">장바구니가 비어있습니다</div>';
      } else {
        const nChecked = lines.filter(l => l.checked).length;
        selRow.innerHTML = `<label class="cart-selall"><input type="checkbox" id="cartSelAll" onchange="toggleAllCart(this.checked)"><span>전체 선택</span><span class="sa-count">${nChecked}개 선택</span></label>`;
        const all = document.getElementById('cartSelAll');
        all.checked = nChecked === lines.length;
        all.indeterminate = nChecked > 0 && nChecked < lines.length;

        lines.forEach(({ id, item, qty, box, per, label, pieces, total, checked }) => {
          const div = document.createElement('div');
          div.className = 'cart-item' + (checked ? '' : ' off');

          const thumbSrc = getThumbSrc(item);
          let thumbHtml = `<div class="cart-item-thumb"><div class="thumb-wrap" data-id="${item.id}" data-c="${escapeHtml(item.c)}"></div></div>`;
          if (thumbSrc) {
            thumbHtml = `<div class="cart-item-thumb"><img class="thumb" src="${thumbSrc}" alt="" style="width:100%;height:100%;object-fit:contain;"></div>`;
          }

          div.innerHTML = `<label class="cart-chk"><input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleCartLine('${id}', this.checked)" aria-label="주문에 포함"></label>` + thumbHtml + `
            <div class="cart-item-content">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div style="flex:1;min-width:0;">
                  <div class="cart-item-name">${escapeHtml(item.n)}</div>
                  <div class="cart-item-spec">${escapeHtml(item.s)}</div>
                  <div class="cart-item-price">${item.p.toLocaleString('ko-KR')}원</div>
                </div>
                <button class="remove-btn" onclick="removeFromCart('${id}')" aria-label="삭제">×</button>
              </div>
              ${boxInfo(item) ? unitToggleHtml(id) : ''}
              <div class="cart-item-qty">
                <button class="qty-btn" style="width:28px;height:28px;font-size:14px;" onclick="updateQty('${id}', -1)" aria-label="빼기">−</button>
                <div style="min-width:30px;text-align:center;font-weight:600;">${box ? qty + '박스' : qty}</div>
                <button class="qty-btn" style="width:28px;height:28px;font-size:14px;" onclick="updateQty('${id}', 1)" aria-label="담기">+</button>
              </div>
              ${box ? `<div class="box-est">= ${pieces}${escapeHtml(label)}</div>` : ''}
              <div class="cart-item-total">${total.toLocaleString('ko-KR')}원${box ? ' (예상)' : ''}</div>
            </div>
          `;
          container.appendChild(div);
        });

        // Fill missing thumbnails in cart
        fillThumbs();
      }

      // Summary (체크한 상품만)
      const sel = lines.filter(l => l.checked);
      const qp = qtyParts(sel);
      const qtyStr = qtyText(qp.ea, qp.box);
      const totalPrice = sel.reduce((a, l) => a + l.total, 0);
      document.getElementById('cartSummaryQty').textContent = qtyStr;
      const noteEl = document.getElementById('cartSummaryNote');
      noteEl.hidden = qp.box === 0;
      noteEl.textContent = qp.box > 0 ? `(박스 안 ${boxInnerText(sel)} 포함 · 예상)` : '';
      document.getElementById('cartSummaryTotal').textContent = `${totalPrice.toLocaleString('ko-KR')}원`;
      document.getElementById('cartBoxNote').hidden = !lines.some(l => l.box);

      // Send button
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = sel.length === 0;
      sendBtn.textContent = sel.length > 0 ? `문자로 주문 · ${qtyStr} · ${totalPrice.toLocaleString('ko-KR')}원` : '문자로 주문 보내기';
      if (scrollEl) scrollEl.scrollTop = prevTop;
    }

    function toggleCartLine(id, on) {
      if (on) cartUnchecked.delete(id); else cartUnchecked.add(id);
      saveToStorage('hm_cart_unchecked', [...cartUnchecked]);
      renderCartSheet();
      updateCartBar();
    }

    function toggleAllCart(on) {
      Object.keys(cart).forEach(id => { if (on) cartUnchecked.delete(id); else cartUnchecked.add(id); });
      saveToStorage('hm_cart_unchecked', [...cartUnchecked]);
      renderCartSheet();
      updateCartBar();
    }

    function removeFromCart(id) {
      delete cart[id];
      delete boxMode[id];
      cartUnchecked.delete(id);
      saveToStorage('cart', cart);
      saveToStorage('hm_box', boxMode);
      saveToStorage('hm_cart_unchecked', [...cartUnchecked]);
      renderCartSheet();
      updateCartBar();
      refreshCard(id);
      if (currentFilter === 'cart') applyFiltersAndSort();
    }

    // 앱 안의 확인창 (window.confirm 대신)
    function showConfirm(message, onOk, okLabel) {
      document.getElementById('confirmMessage').textContent = message;
      const ok = document.getElementById('confirmOk');
      ok.textContent = okLabel || '확인';
      ok.onclick = () => { closeConfirm(); onOk(); };
      document.getElementById('confirmDialog').classList.add('open');
      pushOverlay('confirm');
    }

    function showClearConfirm() {
      showConfirm('장바구니를 비우시겠습니까?', () => {
        cart = {};
        boxMode = {};
        cartUnchecked = new Set();
        saveToStorage('cart', cart);
        saveToStorage('hm_box', boxMode);
        saveToStorage('hm_cart_unchecked', []);
        afterCartBulkChange();
      });
    }

    function hideConfirm() {
      document.getElementById('confirmDialog').classList.remove('open');
    }
    function closeConfirm() {
      hideConfirm();
      popOverlay('confirm');
    }
    overlayHiders.confirm = hideConfirm;

    // ---------- 주문 문구 ----------
    function lineText(l) {
      const base = `${l.item.n} ${l.item.s}`;
      return l.box
        ? `${base} x${l.qty}박스(${l.pieces}${l.label}) = ${l.total.toLocaleString('ko-KR')}원`
        : `${base} x${l.qty} = ${l.total.toLocaleString('ko-KR')}원`;
    }

    function syncOrderFields() {
      ordererName = document.getElementById('ordererName').value;
      orderMemo = document.getElementById('orderMemo').value;
      saveToStorage('ordererName', ordererName);
      saveToStorage('orderMemo', orderMemo);
    }

    function buildOrderText(lines) {
      syncOrderFields();
      lines = lines || cartLines().filter(l => l.checked);
      const qp = qtyParts(lines);
      const totalPrice = lines.reduce((a, l) => a + l.total, 0);

      const now = new Date();
      const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      let text = `[황금마차 주문] ${ordererName}\n${dateStr}\n----\n`;
      lines.forEach((l, i) => {
        text += `${i + 1}. ${lineText(l)}\n`;
      });
      text += `----\n총 ${lines.length}종 · ${qtyText(qp.ea, qp.box)} / 합계 ${totalPrice.toLocaleString('ko-KR')}원`;
      if (orderMemo.trim()) {
        text += `\n메모: ${orderMemo}`;
      }

      return text;
    }

    function copyOrder() {
      if (!cartLines().some(l => l.checked)) { showToast('선택한 상품이 없어요'); return; }
      const text = buildOrderText();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('복사됨')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('복사됨');
      } catch (e) {
        console.error('Copy failed:', e);
      }
      document.body.removeChild(textarea);
    }

    // 토스트 (action 을 주면 버튼이 붙어요)
    let toastEl = null, toastTimer = null;
    function showToast(message, opts) {
      opts = opts || {};
      if (toastEl) { clearTimeout(toastTimer); toastEl.remove(); toastEl = null; }
      const toast = document.createElement('div');
      toast.className = 'toast' + (opts.action ? ' has-action' : '');
      toast.setAttribute('role', 'status');
      const span = document.createElement('span');
      span.textContent = message;
      toast.appendChild(span);
      const duration = opts.duration || 2000;
      if (opts.action) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toast-act';
        btn.textContent = opts.action;
        btn.onclick = () => {
          clearTimeout(toastTimer);
          toast.remove();
          if (toastEl === toast) toastEl = null;
          if (opts.onAction) opts.onAction();
        };
        toast.appendChild(btn);
      }
      toast.style.animationDuration = duration + 'ms';
      document.body.appendChild(toast);
      toastEl = toast;
      toastTimer = setTimeout(() => { toast.remove(); if (toastEl === toast) toastEl = null; }, duration);
    }

    // ---------- 문자 보내기 + 주문 내역 저장 ----------
    let lastOrderUndo = null;
    function goSms(url) { location.href = url; }

    function sendOrder() {
      const lines = cartLines().filter(l => l.checked);
      if (lines.length === 0) return;

      const text = buildOrderText(lines);
      const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
      const separator = isIOS ? '&' : '?';
      const smsUrl = 'sms:' + ORDER_PHONE + separator + 'body=' + encodeURIComponent(text);

      // 1) 문자 앱으로 넘어가기 전에 주문 내역부터 저장
      const rec = {
        id: Date.now(),
        at: new Date().toISOString(),
        name: ordererName,
        memo: orderMemo,
        items: lines.map(l => ({
          id: l.id, n: l.item.n, s: l.item.s, p: l.item.p, qty: l.qty,
          unit: l.box ? 'box' : 'ea', boxSize: l.box ? l.per : 1, boxLabel: l.box ? l.label : ''
        })),
        totalQty: lines.reduce((a, l) => a + l.pieces, 0),
        totalEa: qtyParts(lines).ea,
        totalBox: qtyParts(lines).box,
        totalPrice: lines.reduce((a, l) => a + l.total, 0)
      };
      let orders = getFromStorage('hm_orders', []);
      if (!Array.isArray(orders)) orders = [];
      orders.unshift(rec);
      const saved = saveToStorage('hm_orders', orders.slice(0, 200));

      // 2) 문자 앱 열기
      goSms(smsUrl);
      // 문자 앱으로 넘어간 뒤 장바구니를 닫고(history 항목도 정리), 잠시 뒤 항목을 되돌려요
      closeCart(400);

      // 3) 주문한(체크한) 상품만 장바구니에서 빼기
      const removed = lines.map(l => ({ id: l.id, qty: l.qty, box: l.box }));
      removed.forEach(r => { delete cart[r.id]; delete boxMode[r.id]; cartUnchecked.delete(r.id); });
      saveToStorage('cart', cart);
      saveToStorage('hm_box', boxMode);
      saveToStorage('hm_cart_unchecked', [...cartUnchecked]);
      lastOrderUndo = { orderId: rec.id, lines: removed };
      afterCartBulkChange();

      if (saved) {
        showToast('주문 내역에 저장했어요', { action: '되돌리기', duration: 5000, onAction: undoLastOrder });
      } else {
        showToast('주문 내역을 저장하지 못했어요', { duration: 3000 });
      }
    }

    function undoLastOrder() {
      const u = lastOrderUndo;
      if (!u) return;
      lastOrderUndo = null;
      u.lines.forEach(l => {
        if (!itemById.has(l.id)) return;
        const same = cart[l.id] && isBox(l.id) === l.box;
        cart[l.id] = (same ? cart[l.id] : 0) + l.qty;
        if (l.box) boxMode[l.id] = true; else delete boxMode[l.id];
        cartUnchecked.delete(l.id);
      });
      saveToStorage('cart', cart);
      saveToStorage('hm_box', boxMode);
      saveToStorage('hm_cart_unchecked', [...cartUnchecked]);
      let orders = getFromStorage('hm_orders', []);
      if (Array.isArray(orders)) saveToStorage('hm_orders', orders.filter(o => o.id !== u.orderId));
      afterCartBulkChange();
      if (document.getElementById('historySheet').classList.contains('open')) renderHistory();
      showToast('되돌렸어요');
    }

    // ---------- 주문 내역 시트 ----------
    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    function pad2(n) { return String(n).padStart(2, '0'); }

    function openHistory() {
      if (document.getElementById('historySheet').classList.contains('open')) return;
      renderHistory();
      document.getElementById('historySheet').classList.add('open');
      document.getElementById('historyBody').scrollTop = 0;
      lockBody('hist');
      pushOverlay('hist');
    }
    function hideHistory() {
      document.getElementById('historySheet').classList.remove('open');
      unlockBody('hist');
    }
    function closeHistory() {
      hideHistory();
      popOverlay('hist');
    }
    overlayHiders.hist = hideHistory;

    function renderHistory() {
      const body = document.getElementById('historyBody');
      let orders = getFromStorage('hm_orders', []);
      if (!Array.isArray(orders)) orders = [];
      let html = '<div class="hist-note">이 휴대폰에만 저장돼요</div>';
      if (orders.length === 0) {
        html += '<div class="hist-empty">아직 주문 내역이 없어요</div>';
        body.innerHTML = html;
        return;
      }
      let lastDay = null;
      orders.forEach(o => {
        const d = new Date(o.at);
        if (isNaN(d.getTime())) return;
        const day = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} (${WEEKDAYS[d.getDay()]})`;
        if (day !== lastDay) {
          lastDay = day;
          html += `<div class="hist-day">${day}</div>`;
        }
        const items = Array.isArray(o.items) ? o.items : [];
        const lis = items.map(it => {
          const box = it.unit === 'box';
          const size = it.boxSize || 1;
          const qtyTxt = box ? `${it.qty}박스 (${it.qty * size}${escapeHtml(it.boxLabel || '개')})` : `${it.qty}개`;
          const line = (it.p || 0) * it.qty * (box ? size : 1);
          return `<li><span class="hi-name">${escapeHtml(it.n)}<small>${escapeHtml(it.s)}</small></span>` +
            `<span class="hi-price">${line.toLocaleString('ko-KR')}원<small>${qtyTxt}</small></span></li>`;
        }).join('');
        let hEa = 0, hBox = 0;
        if (Number.isFinite(o.totalEa) && Number.isFinite(o.totalBox)) { hEa = o.totalEa; hBox = o.totalBox; }
        else items.forEach(it => { const q = parseInt(it.qty, 10) || 0; if (it.unit === 'box') hBox += q; else hEa += q; });
        const oid = Number(o.id);
        html += `<div class="hist-card">
          <div class="hist-top">
            <div><span class="hist-time">${pad2(d.getHours())}:${pad2(d.getMinutes())}</span><span class="hist-sum">${items.length}종 · ${qtyText(hEa, hBox)}</span></div>
            <div class="hist-total">${(o.totalPrice || 0).toLocaleString('ko-KR')}원</div>
          </div>
          ${o.name ? `<div class="hist-memo">주문자: ${escapeHtml(o.name)}</div>` : ''}
          ${o.memo ? `<div class="hist-memo">메모: ${escapeHtml(o.memo)}</div>` : ''}
          <details class="hist-items"><summary>상품 목록 보기</summary><ul>${lis}</ul></details>
          <div class="hist-btns">
            <button type="button" class="hb-redo" onclick="reorderFromHistory(${oid})">다시 담기</button>
            <button type="button" class="hb-del" onclick="askDeleteOrder(${oid})">삭제</button>
          </div>
        </div>`;
      });
      body.innerHTML = html;
    }

    function reorderFromHistory(orderId) {
      const orders = getFromStorage('hm_orders', []);
      const o = Array.isArray(orders) ? orders.find(x => x.id === orderId) : null;
      if (!o) return;
      let skipped = 0;
      (o.items || []).forEach(it => {
        const item = itemById.get(it.id);
        if (!item) { skipped++; return; }
        let qty = Math.max(1, parseInt(it.qty, 10) || 1);
        let box = it.unit === 'box';
        if (box && !boxInfo(item)) { qty = qty * (it.boxSize || 1); box = false; }
        if (cart[item.id] && isBox(item.id) === box) cart[item.id] += qty; else cart[item.id] = qty;
        if (box) boxMode[item.id] = true; else delete boxMode[item.id];
        cartUnchecked.delete(item.id);
      });
      saveToStorage('cart', cart);
      saveToStorage('hm_box', boxMode);
      saveToStorage('hm_cart_unchecked', [...cartUnchecked]);
      afterCartBulkChange();
      showToast('장바구니에 담았어요' + (skipped ? ` (판매 종료 ${skipped}개 제외)` : ''));
    }

    function askDeleteOrder(orderId) {
      showConfirm('이 주문 내역을 삭제할까요?', () => {
        let orders = getFromStorage('hm_orders', []);
        if (!Array.isArray(orders)) orders = [];
        saveToStorage('hm_orders', orders.filter(o => o.id !== orderId));
        if (lastOrderUndo && lastOrderUndo.orderId === orderId) lastOrderUndo = null;
        renderHistory();
      }, '삭제');
    }

    // ---------- 분류 선택 시트 ----------
    let draftCats = new Set();
    let catBase = [];
    function openCatSheet() {
      draftCats = new Set(selectedCats);
      catBase = allProducts.filter(passesBase);
      document.getElementById('catList').innerHTML = allCategories.map((c, i) =>
        `<label class="cat-row"><input type="checkbox" data-i="${i}" ${draftCats.has(c) ? 'checked' : ''}>` +
        `<span class="cat-name">${escapeHtml(c)} <span class="cat-count">(${catCounts[c] || 0})</span></span></label>`
      ).join('');
      updateCatApply();
      document.getElementById('catSheet').classList.add('open');
      document.getElementById('catList').scrollTop = 0;
      lockBody('cats');
      pushOverlay('cats');
    }
    function hideCatSheet() {
      document.getElementById('catSheet').classList.remove('open');
      unlockBody('cats');
    }
    function closeCatSheet() {
      hideCatSheet();
      popOverlay('cats');
    }
    overlayHiders.cats = hideCatSheet;
    function onCatChange(e) {
      const t = e.target;
      if (!t || t.type !== 'checkbox') return;
      const c = allCategories[Number(t.dataset.i)];
      if (t.checked) draftCats.add(c); else draftCats.delete(c);
      updateCatApply();
    }
    function updateCatApply() {
      const n = catBase.filter(i => draftCats.size === 0 || draftCats.has(i.c)).length;
      document.getElementById('catApplyBtn').textContent = `적용 (${n}개 상품)`;
    }
    function clearDraftCats() {
      draftCats.clear();
      document.querySelectorAll('#catList input[type=checkbox]').forEach(cb => { cb.checked = false; });
      updateCatApply();
    }
    function applyCats() {
      selectedCats = new Set(draftCats);
      saveToStorage('hm_cats', [...selectedCats]);
      updateCatBtn();
      closeCatSheet();
      displayedCount = 0;
      applyFiltersAndSort({ keepTop: true });
    }

    // Keyboard and overlay event handlers
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const open = id => document.getElementById(id).classList.contains('open');
        if (open('confirmDialog')) {
          closeConfirm();
        } else if (open('zoomModal')) {
          closeZoom();
        } else if (open('catSheet')) {
          closeCatSheet();
        } else if (open('historySheet')) {
          closeHistory();
        } else if (open('cartSheet')) {
          closeCart();
        }
      }
    });

    document.getElementById('zoomModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        closeZoom();
      }
    });

    document.getElementById('cartSheet').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        closeCart();
      }
    });

    document.getElementById('catSheet').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeCatSheet();
    });

    document.getElementById('historySheet').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeHistory();
    });

    // Start
    // ===== 비밀번호 잠금 (AES-GCM, PBKDF2-SHA256) =====
    let CRYPTO_KEY = null;
    const KEY_STORE = 'hm_key_v1';
    const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const b64e = a => btoa(String.fromCharCode(...new Uint8Array(a)));
    let ENC_META = null;
    async function loadMeta() {
      if (!ENC_META) ENC_META = await (await fetch('data/meta.json', { cache: 'no-store' })).json();
      return ENC_META;
    }
    async function deriveKey(pw) {
      const m = await loadMeta();
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(m.salt), iterations: m.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }
    async function decryptFile(path) {
      const r = await fetch(path + '?v=' + (ENC_META ? ENC_META.ver : ''));
      if (!r.ok) throw new Error('fetch ' + r.status);
      const buf = new Uint8Array(await r.arrayBuffer());
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, CRYPTO_KEY, buf.slice(12));
      return JSON.parse(new TextDecoder().decode(pt));
    }
    async function tryKey(key) {
      CRYPTO_KEY = key;
      await loadMeta();
      // 확인용 작은 파일로 비밀번호 검증
      const chk = await decryptFile('data/check.bin');
      if (!chk || chk.ok !== 1) throw new Error('bad');
    }
    function showLock(msg) {
      const lk = document.getElementById('lockScreen');
      lk.hidden = false;
      document.getElementById('lockMsg').textContent = msg || '';
      setTimeout(() => document.getElementById('lockPw').focus(), 50);
    }
    async function unlock(e) {
      if (e) e.preventDefault();
      const pwEl = document.getElementById('lockPw');
      const btn = document.getElementById('lockBtn');
      const pw = pwEl.value;
      if (!pw) return;
      btn.disabled = true; btn.textContent = '확인 중…';
      try {
        const key = await deriveKey(pw);
        await tryKey(key);
        if (document.getElementById('lockRemember').checked) {
          try { localStorage.setItem(KEY_STORE, b64e(await crypto.subtle.exportKey('raw', key))); } catch (_) {}
        }
        pwEl.value = ''; pwEl.blur();
        document.getElementById('lockScreen').hidden = true;
        await init();
      } catch (err) {
        CRYPTO_KEY = null;
        document.getElementById('lockMsg').textContent = '비밀번호가 맞지 않아요';
        pwEl.select();
      } finally {
        btn.disabled = false; btn.textContent = '들어가기';
      }
    }
    function lockNow() {
      try { localStorage.removeItem(KEY_STORE); } catch (_) {}
      location.reload();
    }
    (async () => {
      document.getElementById('lockForm').addEventListener('submit', unlock);
      let saved = null;
      try { saved = localStorage.getItem(KEY_STORE); } catch (_) {}
      if (saved) {
        try {
          const key = await crypto.subtle.importKey('raw', b64d(saved), { name: 'AES-GCM' }, true, ['decrypt']);
          await tryKey(key);
          document.getElementById('lockScreen').hidden = true;
          await init();
          return;
        } catch (_) {
          try { localStorage.removeItem(KEY_STORE); } catch (__) {}
        }
      }
      showLock('');
    })().catch(e => console.error('init() error:', e));
  </script>
</body>
