<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>황금마차</title>
  <link rel="icon" href="mascot.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#b5452a">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --color-bg: #f6ecdc;
      --color-fg: #3a2618;
      --color-border: #ead8bd;
      --color-text-secondary: #8a6a52;
      --color-card: #fffaf1;
      --color-muted: #8a6a52;
      --color-maple: #b5452a;
      --color-burnt-orange: #c96a28;
      --color-mustard: #d8a23a;
      --color-olive: #6b7a3a;
      --color-accent: #b5452a;
      --color-accent-light: #fff5e6;
      --color-badge-new: #d8a23a;
      --color-badge-out: #b5452a;
      --color-red: #d32f2f;
      --spacing: 16px;
      --radius: 14px;
      --color-bar: rgba(255, 248, 236, 0.92);
      --grain-1: rgba(255, 248, 236, 0.4);
      --grain-2: rgba(232, 218, 189, 0.3);
      --font-serif: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      --font-sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --color-bg: #1c1410;
        --color-fg: #f1e3cf;
        --color-border: #3d2c20;
        --color-text-secondary: #c2a68a;
        --color-card: #2a1f18;
        --color-muted: #c2a68a;
        --color-maple: #d0603f;
        --color-burnt-orange: #e0953a;
        --color-mustard: #e0953a;
        --color-olive: #a8b368;
        --color-accent-light: #3d2c20;
        --color-bar: rgba(28, 20, 16, 0.92);
        --grain-1: rgba(120, 60, 30, 0.10);
        --grain-2: rgba(90, 40, 20, 0.12);
      }
    }

    :root[data-theme="dark"] {
      --color-bg: #1c1410;
      --color-fg: #f1e3cf;
      --color-border: #3d2c20;
      --color-text-secondary: #c2a68a;
      --color-card: #2a1f18;
      --color-muted: #c2a68a;
      --color-maple: #d0603f;
      --color-burnt-orange: #e0953a;
      --color-mustard: #e0953a;
      --color-olive: #a8b368;
      --color-accent-light: #3d2c20;
      --color-bar: rgba(28, 20, 16, 0.92);
      --grain-1: rgba(120, 60, 30, 0.10);
      --grain-2: rgba(90, 40, 20, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background: var(--color-bg);
      background-image:
        radial-gradient(circle at 20% 50%, var(--grain-1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, var(--grain-2) 0%, transparent 50%),
        linear-gradient(135deg, rgba(212, 165, 116, 0.05) 0%, transparent 100%);
      color: var(--color-fg);
      line-height: 1.5;
      font-size: 16px;
    }

    html, body {
      height: 100%;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, #6e2a1c 0%, #b5452a 50%, #d98a2b 100%);
      border-bottom: 1px solid rgba(181, 69, 42, 0.3);
      padding: var(--spacing);
      padding-bottom: calc(var(--spacing) * 1.2);
      border-radius: 0 0 20px 20px;
      overflow: hidden;
      position: relative;
    }

    .header-title, .header-subtitle, .header-tagline { position: relative; z-index: 1; }

    .header-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand-logo {
      flex-shrink: 0;
      animation: bobbing 3s ease-in-out infinite;
    }

    @keyframes bobbing {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand-logo {
        animation: none;
      }
    }

    .header-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      font-family: var(--font-serif);
      color: white;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      margin: 8px 0 0 0;
      font-size: 13px;
      font-family: var(--font-sans);
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
    }

    .header-tagline {
      margin: 2px 0 0 0;
      font-size: 11px;
      font-style: italic;
      font-family: var(--font-sans);
      color: rgba(255, 255, 255, 0.7);
      font-weight: 300;
    }

    /* Falling leaves animation */
    @keyframes fall {
      0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
      10%  { opacity: .85; }
      30%  { transform: translate(var(--sway-amount, 12px), 30px) rotate(110deg); }
      55%  { transform: translate(0, 85px) rotate(200deg); }
      80%  { transform: translate(var(--sway-amount, 12px), 140px) rotate(290deg); opacity: .7; }
      100% { transform: translate(var(--drift, 0), 190px) rotate(360deg); opacity: 0; }
    }

    .header-leaf {
      position: absolute;
      top: 0;
      z-index: 0;
      font-size: 18px;
      pointer-events: none;
      opacity: 0.7;
    }

    .header-leaf:nth-of-type(1) {
      left: 10%;
      animation: fall 10s ease-in-out infinite;
      --drift: 20px;
      --sway-amount: 15px;
      animation-delay: 0s;
    }

    .header-leaf:nth-of-type(2) {
      left: 25%;
      animation: fall 12s ease-in-out infinite;
      --drift: -15px;
      --sway-amount: -12px;
      animation-delay: 2s;
    }

    .header-leaf:nth-of-type(3) {
      left: 45%;
      animation: fall 11s ease-in-out infinite;
      --drift: 25px;
      --sway-amount: 10px;
      animation-delay: 4s;
    }

    .header-leaf:nth-of-type(4) {
      left: 65%;
      animation: fall 13s ease-in-out infinite;
      --drift: -20px;
      --sway-amount: -15px;
      animation-delay: 1s;
    }

    .header-leaf:nth-of-type(5) {
      left: 80%;
      animation: fall 10.5s ease-in-out infinite;
      --drift: 18px;
      --sway-amount: 8px;
      animation-delay: 3s;
    }

    .header-leaf:nth-of-type(6) {
      left: 15%;
      animation: fall 11.5s ease-in-out infinite;
      --drift: -22px;
      --sway-amount: -10px;
      animation-delay: 5s;
    }

    .header-leaf:nth-of-type(7) {
      left: 55%;
      animation: fall 12s ease-in-out infinite;
      --drift: 20px;
      --sway-amount: 12px;
      animation-delay: 2.5s;
    }

    .header-leaf:nth-of-type(8) {
      left: 35%;
      animation: fall 10.5s ease-in-out infinite;
      --drift: -18px;
      --sway-amount: -8px;
      animation-delay: 4.5s;
    }

    @media (prefers-reduced-motion: reduce) {
      .header-leaf {
        display: none;
      }
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 99;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      padding: var(--spacing);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .category-row::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      padding: 7px 14px;
      border: 1.5px solid var(--color-border);
      border-radius: 20px;
      background: var(--color-card);
      color: var(--color-fg);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font-sans);
      white-space: nowrap;
      transition: all 0.2s;
      font-weight: 500;
    }

    .category-chip.active {
      background: linear-gradient(135deg, var(--color-maple) 0%, var(--color-burnt-orange) 100%);
      color: white;
      border-color: var(--color-maple);
      box-shadow: 0 2px 8px rgba(181, 69, 42, 0.25);
    }

    .category-header {
      margin: 18px 0 8px;
      padding: 6px 2px 8px 2px;
      font-size: 17px;
      font-weight: 700;
      font-family: var(--font-serif);
      color: var(--color-fg);
      border-bottom: 2px dashed;
      border-image: linear-gradient(90deg, var(--color-maple) 0%, var(--color-mustard) 50%, transparent 100%) 1;
      letter-spacing: -0.3px;
    }

    .category-header::before {
      content: '🍂 ';
      margin-right: 4px;
      opacity: 0.8;
    }

    .search-box {
      width: 100%;
      padding: 12px 12px 12px 38px;
      border: 1.5px solid var(--color-border);
      border-radius: 16px;
      font-size: 16px;
      font-family: var(--font-sans);
      background: var(--color-card);
      color: var(--color-fg);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238a6a52"><path d="M15.5 14h-.79l-.28-.27a6.47 6.47 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5-3.12 0-5.63 2.51-5.63 5.63s2.51 5.63 5.63 5.63c2.07 0 3.87-1.13 4.85-2.8l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-5.87 0C7.6 14 5.98 12.37 5.98 10.5S7.6 7 9.63 7c2.03 0 3.65 1.63 3.65 3.5S11.66 14 9.63 14z"/></svg>');
      background-repeat: no-repeat;
      background-position: 10px center;
      background-size: 20px 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--color-mustard);
      box-shadow: 0 0 0 3px rgba(216, 162, 58, 0.1);
    }

    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .chip {
      padding: 7px 14px;
      border: 1.5px solid var(--color-border);
      border-radius: 20px;
      background: var(--color-card);
      color: var(--color-fg);
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font-sans);
      white-space: nowrap;
      transition: all 0.2s;
      font-weight: 500;
    }

    .chip.active {
      background: linear-gradient(135deg, var(--color-maple) 0%, var(--color-burnt-orange) 100%);
      color: white;
      border-color: var(--color-maple);
      box-shadow: 0 2px 8px rgba(181, 69, 42, 0.25);
    }

    .sort-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .sort-row label {
      font-size: 13px;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }

    .sort-select {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid var(--color-border);
      border-radius: 16px;
      font-size: 13px;
      font-family: var(--font-sans);
      background: var(--color-card);
      color: var(--color-fg);
      cursor: pointer;
      transition: all 0.2s;
    }

    .sort-select:focus {
      outline: none;
      border-color: var(--color-mustard);
      box-shadow: 0 0 0 3px rgba(216, 162, 58, 0.1);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing);
      padding-bottom: calc(90px + var(--spacing));
    }

    .result-count {
      font-size: 12px;
      font-family: var(--font-sans);
      color: var(--color-text-secondary);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .card {
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-maple);
      border-radius: 16px;
      padding: var(--spacing);
      margin-bottom: 12px;
      background: var(--color-card);
      transition: all 0.2s;
      box-shadow: 0 2px 10px rgba(120, 70, 30, 0.08);
    }

    .card:nth-of-type(even) {
      border-left-color: var(--color-burnt-orange);
    }

    .card.in-cart {
      background: var(--color-card);
      border: 2px solid var(--color-mustard);
      border-left: 4px solid var(--color-mustard);
      box-shadow: 0 0 12px rgba(216, 162, 58, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-name {
      font-weight: 600;
      font-size: 15px;
      font-family: var(--font-sans);
      flex: 1;
      color: var(--color-fg);
      word-break: break-word;
      letter-spacing: -0.2px;
    }

    .badge-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .badge-new {
      background: var(--color-mustard);
      color: var(--color-fg);
      font-weight: 600;
      border-radius: 8px;
      font-family: var(--font-sans);
    }

    .badge-out {
      background: var(--color-maple);
      color: white;
      font-weight: 600;
      border-radius: 8px;
      font-family: var(--font-sans);
    }

    .card-meta {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
    }

    .card-price {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-family: var(--font-sans);
      color: var(--color-maple);
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }

    .card-qty {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .qty-btn {
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--color-border);
      background: var(--color-card);
      color: var(--color-fg);
      cursor: pointer;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-family: var(--font-sans);
    }

    .qty-btn:nth-of-type(3) {
      background: var(--color-burnt-orange);
      color: white;
      border-color: var(--color-burnt-orange);
      box-shadow: 0 2px 8px rgba(201, 106, 40, 0.2);
    }

    .qty-btn:nth-of-type(3):active {
      box-shadow: 0 1px 4px rgba(201, 106, 40, 0.3);
    }

    .qty-display {
      min-width: 30px;
      text-align: center;
      font-weight: 600;
    }


    .load-more-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1.5px solid var(--color-border);
      background: var(--color-card);
      color: var(--color-maple);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      border-radius: 16px;
      transition: all 0.2s;
    }

    .load-more-btn:active {
      background: var(--color-accent-light);
    }

    .cart-bar {
      display: none;
    }

    .floating-cart-btn {
      position: fixed;
      right: 14px;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-maple) 0%, var(--color-burnt-orange) 100%);
      border: none;
      cursor: pointer;
      z-index: 50;
      box-shadow: 0 4px 12px rgba(181, 69, 42, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      padding: 0;
    }

    .floating-cart-btn:active {
      box-shadow: 0 2px 6px rgba(181, 69, 42, 0.4);
    }

    .floating-cart-btn.bounce {
      animation: cartBounce 0.4s ease-out;
    }

    @keyframes cartBounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: var(--color-mustard);
      color: var(--color-fg);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-sans);
    }

    .cart-badge.show {
      display: flex;
    }

    .cart-total-pill {
      position: absolute;
      right: 66px;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 2px 8px rgba(120,70,30,.18);
      background: var(--color-mustard);
      color: var(--color-fg);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-sans);
      white-space: nowrap;
      display: none;
    }

    .cart-total-pill.show {
      display: block;
    }

    .zoom-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 210;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .zoom-modal.open {
      display: flex;
    }

    .zoom-content {
      background: var(--color-bg);
      border-radius: 20px;
      padding: 20px;
      max-width: 100%;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: zoomIn 0.2s ease-out;
      position: relative;
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .zoom-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: var(--color-fg);
      padding: 0;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-image-area {
      max-width: 320px;
      max-height: 320px;
      width: 100%;
      height: auto;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-image-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .zoom-details {
      text-align: center;
    }

    .zoom-name {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--color-fg);
      margin-bottom: 8px;
      word-break: break-word;
    }

    .zoom-badges {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .zoom-meta {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-bottom: 12px;
    }

    .zoom-price {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-maple);
      margin-bottom: 12px;
    }

    .zoom-qty {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .zoom-links {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cart-sheet {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      flex-direction: column;
    }

    .cart-sheet.open {
      display: flex;
    }

    .cart-sheet-inner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--color-bg);
      background-image:
        radial-gradient(circle at 20% 50%, rgba(255, 248, 236, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(232, 218, 189, 0.3) 0%, transparent 50%);
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .cart-header {
      flex: none;
      padding: var(--spacing);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h2 {
      margin: 0;
      font-size: 20px;
      font-family: var(--font-serif);
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .cart-header h2::before {
      content: '🧺 ';
      margin-right: 6px;
    }

    .cart-close {

    .cart-item-total {

    .remove-btn {

      font-size: 18px;
      padding: 0;
    }

    .cart-summary {

      margin-top: 12px;
      font-size: 14px;
      color: var(--color-fg);
    }

    .cart-summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .cart-summary-total {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-accent);
      display: flex;
      justify-content: space-between;
    }

    .cart-footer {
      flex: none;
      padding: 10px var(--spacing) calc(10px + env(safe-area-inset-bottom, 0px));

      flex-direction: column;
      gap: 8px;
    }
    .order-info { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 10px; }
    .order-info-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
    .order-info .receiver-info { margin-bottom: 0; }
    .order-info .form-input, .order-info .form-textarea { font-size: 16px; scroll-margin-bottom: 24px; }
    .order-info .form-textarea { height: 72px; }
    .cart-content .action-btns { margin-top: 14px; padding-bottom: 8px; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 12px;
      color: var(--color-text-secondary);
      font-weight: 600;
    }

    .form-input, .form-textarea {
      padding: 11px 12px;
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      font-size: 14px;
      font-family: var(--font-sans);
      background: var(--color-card);
      color: var(--color-fg);

    }

    .form-input:focus, .form-textarea:focus {

    }

    .form-textarea {

    }

    .receiver-info {
      font-size: 12px;
      font-family: var(--font-sans);
      color: var(--color-text-secondary);
      padding: 10px 12px;
      background: var(--color-accent-light);
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid var(--color-border);
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .action-btns button {
      flex: 1;
      padding: 12px;
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-clear {
      background: var(--color-card);
      color: var(--color-fg);
      border-color: var(--color-border);
    }

    .btn-clear:active {
      background: var(--color-accent-light);
    }

    .btn-copy {
      background: linear-gradient(135deg, var(--color-maple) 0%, var(--color-burnt-orange) 100%);
      color: white;
      border-color: var(--color-maple);
      box-shadow: 0 2px 6px rgba(181, 69, 42, 0.15);
    }

    .btn-copy:active {
      box-shadow: 0 1px 3px rgba(181, 69, 42, 0.2);
    }

    .btn-send {
      background: linear-gradient(135deg, var(--color-maple) 0%, var(--color-burnt-orange) 100%);
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-family: var(--font-sans);
      font-weight: 600;
      border: none;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(181, 69, 42, 0.2);
      transition: all 0.2s;
      letter-spacing: -0.2px;
    }

    .btn-send:active:not(:disabled) {
      box-shadow: 0 1px 4px rgba(181, 69, 42, 0.3);
    }

    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 300;
      animation: fadeInOut 2s ease-in-out;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      10%, 90% { opacity: 1; }
    }

    .confirm-dialog {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 250;
      align-items: center;
      justify-content: center;
    }

    .confirm-dialog.open {
      display: flex;
    }

    .confirm-box {
      background: var(--color-bg);
      border-radius: 16px;
      padding: var(--spacing);
      max-width: 300px;
      text-align: center;
      border: 1px solid var(--color-border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .confirm-message {
      margin-bottom: 16px;
      color: var(--color-fg);
      font-size: 14px;
      font-family: var(--font-sans);
    }

    .confirm-buttons {
      display: flex;
      gap: 8px;
    }

    .confirm-buttons button {
      flex: 1;
      padding: 11px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-family: var(--font-sans);
      font-size: 14px;
      transition: all 0.2s;
    }

    .confirm-cancel {
      background: var(--color-card);
      color: var(--color-fg);
      border-color: var(--color-border);
    }

    .confirm-cancel:active {
      background: var(--color-accent-light);
    }

    .confirm-ok {
      background: var(--color-maple);
      color: white;
      border-color: var(--color-maple);
      box-shadow: 0 2px 6px rgba(181, 69, 42, 0.15);
    }

    .confirm-ok:active {
      box-shadow: 0 1px 3px rgba(181, 69, 42, 0.2);
    }

    @media (max-width: 360px) {
      :root {
        --spacing: 12px;
      }
      body {
        font-size: 15px;
      }
    }

    .decorative-footer {
      text-align: center;
      padding: 16px 0;
      margin-top: 8px;
      font-size: 14px;
      color: var(--color-muted);
      opacity: 0.6;
    }

    /* ---- 컴팩트 카드 (썸네일 + 가로 배치) ---- */
    .card { padding: 10px 12px !important; margin-bottom: 8px !important; }
    .c-row { display: flex; gap: 12px; align-items: flex-start; }
    .thumb-wrap { flex: 0 0 76px; width: 76px; height: 76px; border-radius: 12px; background: #fff; border: 1px solid var(--color-border); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .thumb-wrap .thumb { width: 100%; height: 100%; object-fit: contain; display: block; }
    .thumb-wrap.noimg::after { content: "🍂"; font-size: 26px; opacity: .55; }
    .c-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .c-body .card-name { font-size: 14.5px; line-height: 1.3; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .c-body .card-meta { font-size: 11.5px; margin: 0; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-body .card-meta .badge { font-size: 10px; padding: 1px 6px; margin-right: 4px; vertical-align: 1px; }
    .c-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
    .c-bottom .card-price { font-size: 16.5px; margin: 0; }
    .c-head { display: flex; align-items: flex-start; gap: 8px; }
    .c-head .card-name { flex: 1 1 auto; min-width: 0; }
    .c-head .search-links { flex: none; align-self: flex-start; margin: 0 0 0 auto; gap: 6px; flex-wrap: nowrap; }
    .c-bottom .card-qty { flex: none; margin: 0; gap: 4px; }
    .c-bottom .qty-btn { width: 32px !important; height: 32px !important; min-width: 32px; min-height: 32px; font-size: 16px; padding: 0; }
    .c-bottom .qty-display { min-width: 18px; font-size: 15px; white-space: nowrap; text-align: center; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .thumb-wrap { background: #f3e9da; } }

    /* Two-column layout for larger screens */
    @media (min-width: 600px) {
      .container {
        max-width: 1100px;
      }

      #productList {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .category-header {
        grid-column: 1 / -1;
      }

      .load-more-btn {
        grid-column: 1 / -1;
      }

      .decorative-footer {
        grid-column: 1 / -1;
      }

      .card {
        margin-bottom: 0;
      }

      .cart-sheet-inner {
        position: fixed;
        top: 0;
        right: 0;
        left: auto;
        bottom: 0;
        max-width: 480px;
        width: 100%;
        border-radius: 0;
        animation: slideInRight 0.3s ease-out;
      }

      @keyframes slideInRight {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
    }

    /* ---- 가독성 (Pretendard) ---- */
    body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
    .header-title { font-weight: 800; letter-spacing: -0.02em; }
    .header-tagline { font-style: normal; animation: tagFade 0.4s ease-out both; }
    @keyframes tagFade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .header-tagline { animation: none; } }
    .card-name, .c-body .card-name { font-weight: 600; letter-spacing: -0.02em; }
    .card-price, .c-bottom .card-price { font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .c-body .card-meta { font-size: 12px; }
    .category-header { font-weight: 700; letter-spacing: -0.02em; }
    input, select, textarea, button { font-family: inherit; }

    /* ---- 버전 표시 (왼쪽 아래 모퉁이) ---- */
    .app-version { position: fixed; left: 10px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 40; font-size: 10.5px; font-weight: 500; color: var(--color-text-secondary); background: var(--color-bar, rgba(255,248,236,.9)); border: 1px solid var(--color-border); padding: 2px 8px; border-radius: 999px; opacity: .85; pointer-events: none; font-variant-numeric: tabular-nums; }

    input[type="search"]::-webkit-search-decoration, input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; }
    input[type="search"] { -webkit-appearance: none; appearance: none; }

    /* ---- 잠금 화면 ---- */
    .lock-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(circle at 30% 20%, #e9a05b 0%, #b5452a 45%, #5e2318 100%); }
    .lock-screen[hidden] { display: none; }
    .lock-card { width: 100%; max-width: 340px; background: var(--color-card); border-radius: 22px; padding: 28px 22px 20px; text-align: center;
      box-shadow: 0 18px 50px rgba(60,20,10,.35); display: flex; flex-direction: column; gap: 10px; }
    .lock-logo { margin: 0 auto; animation: bob 3s ease-in-out infinite; }
    .lock-title { margin: 0; font-size: 26px; font-weight: 800; color: var(--color-fg); letter-spacing: -0.02em; }
    .lock-sub { margin: 0 0 6px; font-size: 13.5px; color: var(--color-text-secondary); }
    .lock-input { width: 100%; font-size: 17px; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--color-border); background: var(--color-bg); color: var(--color-fg); text-align: center; }
    .lock-input:focus { outline: none; border-color: var(--color-mustard); box-shadow: 0 0 0 3px rgba(216,162,58,.25); }
    .lock-remember { font-size: 13px; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .lock-btn { margin-top: 4px; padding: 13px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--color-maple), var(--color-burnt-orange)); }
    .lock-btn:disabled { opacity: .7; }
    .lock-msg { min-height: 18px; margin: 2px 0 0; font-size: 13px; color: #c62828; }
    .lock-now { position: absolute; top: 14px; right: 14px; z-index: 2; background: rgba(255,255,255,.18); border: none; border-radius: 999px; width: 40px; height: 40px; font-size: 18px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: #fff; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .lock-logo { animation: none; } }

    /* ================= v2.1 ================= */
    .content { overflow-anchor: none; }

    /* 분류 버튼 (체크박스 시트 열기) */
    .cat-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px; border: 1.5px solid var(--color-border); border-radius: 16px; background: var(--color-card); color: var(--color-fg); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; transition: border-color .2s; }
    .cat-btn.has-sel { border-color: var(--color-maple); }
    .cat-btn-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-badge { display: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--color-maple); color: #fff; font-size: 11px; font-weight: 700; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
    .cat-badge.show { display: inline-flex; }
    .cat-caret { color: var(--color-text-secondary); font-size: 11px; }

    /* 공용 하단 시트 */
    .sheet-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 220; display: none; align-items: flex-end; justify-content: center; overscroll-behavior: contain; }
    .sheet-overlay.open { display: flex; }

    .sheet-panel.tall { max-height: 85vh; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--color-border); flex: none; }
    .sheet-head h2 { margin: 0; font-size: 18px; font-weight: 700; font-family: var(--font-serif); letter-spacing: -0.3px; }
    .sheet-close { width: 44px; height: 44px; background: none; border: none; font-size: 22px; line-height: 1; color: var(--color-fg); cursor: pointer; }
    .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 4px 16px 12px; }
    .sheet-foot { flex: none; display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--color-border); background: var(--color-bg); }
    .sheet-foot button { min-height: 46px; padding: 0 14px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--color-border); background: var(--color-card); color: var(--color-fg); }
    .sheet-foot .btn-primary { flex: 1; border: none; color: #fff; background: linear-gradient(135deg, var(--color-maple) 0%, var(--color-burnt-orange) 100%); box-shadow: 0 2px 8px rgba(181,69,42,.2); }
    .cat-row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 2px; border-bottom: 1px solid var(--color-border); cursor: pointer; }
    .cat-row input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--color-maple); }
    .cat-row .cat-name { flex: 1; font-size: 15px; font-weight: 500; }
    .cat-row .cat-count { color: var(--color-text-secondary); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; }

    /* 박스 주문 */
    .badge-box { background: var(--color-mustard); color: #3a2618; font-weight: 600; border-radius: 8px; }
    .unit-toggle { display: inline-flex; flex: none; border: 1.5px solid var(--color-border); border-radius: 999px; overflow: hidden; background: var(--color-card); }
    .unit-opt { min-height: 28px; padding: 3px 10px; border: none; background: transparent; color: var(--color-text-secondary); font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .unit-opt.on { background: var(--color-mustard); color: #3a2618; }
    .box-est { font-size: 11.5px; color: var(--color-burnt-orange); font-weight: 600; font-variant-numeric: tabular-nums; margin: 0; }
    .box-est[hidden] { display: none; }
    .c-tools { display: flex; align-items: center; justify-content: flex-start; gap: 6px; margin-top: 2px; }
    .c-bottom .qty-display.boxed { min-width: 44px; }

    /* 비교 사이트 아이콘 */
    .search-links { display: flex; gap: 6px; align-items: center; }
    .search-icon { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 1px solid var(--color-border); background: #fff; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; overflow: hidden; }
    .search-icon img { width: 20px; height: 20px; display: block; }
    .search-icon .si-fb { display: none; font-size: 12px; font-weight: 700; color: var(--color-olive); line-height: 1; }

    .zoom-qty { flex-direction: column; gap: 8px; }
    .zoom-qty .zoom-step { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .zoom-qty .qty-display { min-width: 48px; }

    /* 장바구니 선택 */
    .cart-selall { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 4px 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .cart-selall input, .cart-chk input { width: 22px; height: 22px; margin: 0; accent-color: var(--color-maple); flex: none; }
    .cart-selall .sa-count { margin-left: auto; font-weight: 500; font-size: 13px; color: var(--color-text-secondary); }
    .cart-chk { align-self: stretch; width: 30px; margin: 0 -2px 0 -4px; display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
    .cart-item.off { opacity: .55; }
    .cart-item .unit-toggle { align-self: flex-start; }
    .cart-item .box-est { margin-top: -2px; }
    .cart-summary-sub { margin: -4px 0 8px; text-align: right; font-size: 11.5px; color: var(--color-text-secondary); }
    .cart-summary-sub[hidden] { display: none; }
    .btn-send { white-space: nowrap; }
    .cart-note { margin-top: 10px; font-size: 12px; color: var(--color-text-secondary); }
    .cart-note[hidden] { display: none; }
    .btn-send { min-height: 48px; }

    /* 토스트(되돌리기) */
    .toast { max-width: calc(100% - 32px); text-align: center; }
    .toast.has-action { display: flex; align-items: center; gap: 12px; padding: 4px 6px 4px 16px; font-size: 13px; }
    .toast .toast-act { min-height: 40px; padding: 0 12px; border: none; background: transparent; color: var(--color-mustard); font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 8px; }

    /* 주문 내역 */

    .hist-btns .hb-redo { border: none; color: #fff; background: linear-gradient(135deg, var(--color-maple) 0%, var(--color-burnt-orange) 100%); }

    .lock-now.hist-now { right: 62px; width: auto; height: 40px; padding: 0 12px 0 10px; gap: 4px; font-size: 14px; font-weight: 600; white-space: nowrap; -webkit-tap-highlight-color: transparent; }

  <script>
    // ========== CONFIG ==========
    let ORDER_PHONE = '';   // 암호화된 데이터에서 불러옴
    let ORDER_NAME = '';    // 암호화된 데이터에서 불러옴
    const APP_VERSION = 'v2.4';      // 화면 아래 모퉁이에 표시되는 버전
    const APP_BUILD = '2026-10-07';

    // ---- 소주·맥주 박스 주문 규칙 (직접 고쳐 쓰는 표) ----
    // 주류(분류 '주류') 중 가격 3,000원 미만인 소주·맥주에만 적용돼요.
    //  kind    : '소주' | '맥주'  (상품 이름으로 자동 판별, boxInfo() 참고)
    //  pattern : 이름+규격에 이 정규식이 들어 있어야 해요. null 이면 조건 없음
    //  ml      : 숫자 = 그 용량만, [최소, 최대] = 그 범위(포함). 이름·규격에서 처음 나오는 "숫자ml" 를 써요
    //  size    : 1박스에 들어 있는 개수,  label : 단위 이름(병/캔)
    // 위에서부터 차례로 보고, 처음 맞는 규칙 하나만 써요. 값은 예상치예요.
    const BOX_RULES = [
      { kind: '소주', pattern: /PET|페트/i, ml: 640, size: 15, label: '병' },
      { kind: '소주', pattern: /PET|페트/i, ml: 500, size: 20, label: '병' },
      { kind: '소주', pattern: null, ml: [300, 400], size: 20, label: '병' },   // 360ml 병 등
      { kind: '맥주', pattern: /병/, ml: [300, 700], size: 20, label: '병' },
      { kind: '맥주', pattern: null, ml: [300, 520], size: 24, label: '캔' },
    ];

    // ---- 머리글 한 줄 문구 (열 때마다 무작위, 직전과 같은 문구는 피해요) ----
    const TAGLINES = [
      "깊어가는 가을, 필요한 것만 소담하게 담아요",
      "단풍처럼 고운 하루, 장바구니도 넉넉하게",
      "바람이 선선한 날, 꼭 필요한 것부터 챙겨요",
      "가을볕 아래 천천히, 오늘의 장보기",
      "낙엽 밟는 소리처럼 가볍게 골라 담아요",
      "노을빛 저녁 식탁을 위한 장보기",
      "햇살 좋은 가을날, 마음까지 든든하게",
      "한 잎 한 잎 모으듯, 알뜰하게 담아요",
      "따뜻한 차 한 잔 같은 장보기 시간",
      "풍성한 계절, 우리 집 곳간도 풍성하게",
      "오늘도 수고한 가족을 위한 작은 선물",
      "가을 하늘처럼 맑게, 꼭 필요한 만큼만",
      "소복이 쌓인 낙엽처럼 정성껏 골라요",
      "선선한 바람 따라 장바구니 산책",
      "황금빛 들녘처럼 넉넉한 하루 되세요",
      "단풍 구경 가듯 설레는 장보기",
      "쌀쌀한 아침엔 따끈한 국물이 생각나요",
      "가족의 웃음을 담는 황금마차",
      "천천히 고르고, 알뜰하게 담아요",
      "가을밤 긴긴밤, 간식도 미리 챙겨요",
      "바스락 가을 길, 황금마차가 함께해요",
      "오늘 저녁 메뉴는 정하셨나요?",
      "계절이 바뀌듯 장바구니도 새롭게",
      "은은한 가을 향기 담아 장보기",
      "작은 것 하나에도 마음을 담아요"
    ];
    // ========== END CONFIG ==========

    // 페이지가 열리자마자 무작위 문구를 보여줘요 (잠금 해제를 기다리지 않아요)
    (function setRandomTagline() {
      try {
        const el = document.getElementById('headerTagline');
        if (!el || !TAGLINES.length) return;
        let last = -1;
        try { const v = parseInt(localStorage.getItem('hm_tag'), 10); if (Number.isInteger(v)) last = v; } catch (_) {}
        let i = Math.floor(Math.random() * TAGLINES.length);
        if (TAGLINES.length > 1 && i === last) i = (i + 1 + Math.floor(Math.random() * (TAGLINES.length - 1))) % TAGLINES.length;
        el.textContent = TAGLINES[i];
        try { localStorage.setItem('hm_tag', String(i)); } catch (_) {}
      } catch (_) {}
    })();

    let allProducts = [];
    let allCategories = [];
    let DATA_CATS = [];
    let filteredProducts = [];
    let displayedCount = 0;
    const ITEMS_PER_PAGE = 60;

    let cart = {};            // {id: 수량}  (boxMode[id] 가 true 면 박스 수)
    let boxMode = {};         // {id: true}  박스 단위로 담은 상품
    let cartUnchecked = new Set();   // 장바구니에서 체크 해제한 상품 id
    let selectedCats = new Set();    // 비어 있으면 전체 분류
    let itemById = new Map();
    let ordererName = '';
    let orderMemo = '';

    let currentFilter = 'all';
    let currentSort = 'category';
    let searchQuery = '';
    let searchTimeout;

    // HTML escape
    function escapeHtml(text) {
      text = String(text == null ? '' : text);
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, c => map[c]);
    }

    // localStorage helpers with try/catch
    function getFromStorage(key, defaultValue) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : defaultValue;
      } catch (e) {
        return defaultValue;
      }
    }

    function saveToStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        // Storage quota exceeded or disabled, continue without persistence
        return false;
      }
    }

    // Init
    async function init() {
      // Load products
      try {
        const data = await decryptFile('data/p.bin');
        ORDER_PHONE = (data.config && data.config.phone) || '';
        ORDER_NAME = (data.config && data.config.name) || '';
        document.getElementById('receiverInfo').textContent = '받는 사람: ' + ORDER_NAME;
        // 담배는 제외
        allProducts = (data.items || []).filter(i => i.c !== '담배');
        DATA_CATS = data.cats || [];
        allCategories = (data.cats || []).filter(c => allProducts.some(i => i.c === c));
        document.getElementById('updated-date').textContent = data.updated || '-';
      } catch (e) {
        console.error('Failed to load products:', e);
        return;
      }

      // Build search cache
      buildSearchCache();
      itemById = new Map(allProducts.map(i => [i.id, i]));

      // Load cart & form state
      cart = getFromStorage('cart', {});
      if (!cart || typeof cart !== 'object' || Array.isArray(cart)) cart = {};
      // 영외 목록에 없는 예전 장바구니 항목 정리
      Object.keys(cart).forEach(id => { if (!itemById.has(id) || !(cart[id] > 0)) delete cart[id]; });
      boxMode = getFromStorage('hm_box', {});
      if (!boxMode || typeof boxMode !== 'object' || Array.isArray(boxMode)) boxMode = {};
      Object.keys(boxMode).forEach(id => { if (!cart[id] || !boxMode[id] || !boxInfo(itemById.get(id))) delete boxMode[id]; });
      const unc = getFromStorage('hm_cart_unchecked', []);
      cartUnchecked = new Set((Array.isArray(unc) ? unc : []).filter(id => cart[id]));
      const savedCats = getFromStorage('hm_cats', []);
      selectedCats = new Set((Array.isArray(savedCats) ? savedCats : []).filter(c => allCategories.includes(c)));

      // Build category button
      buildCategoryChips();
      ordererName = getFromStorage('ordererName', '');
      orderMemo = getFromStorage('orderMemo', '');

      document.getElementById('ordererName').value = ordererName;
      document.getElementById('orderMemo').value = orderMemo;

      // Setup event listeners
      document.getElementById('searchInput').addEventListener('input', onSearch);
      // 키보드의 '이동/검색/엔터'를 누르면 바로 검색하고 키보드를 내림
      const hideKeyboard = () => {
        const el = document.getElementById('searchInput');
        clearTimeout(searchTimeout);
        searchQuery = el.value.trim();
        displayedCount = 0;
        applyFiltersAndSort({ keepTop: true });
        el.blur();
      };
      document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); hideKeyboard(); });
      document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); hideKeyboard(); }
      });
      // 목록을 스크롤하면 키보드 내림
      window.addEventListener('touchmove', () => {
        const el = document.getElementById('searchInput');
        if (document.activeElement === el) el.blur();

    // Normalize string for search: NFC, lowercase, remove whitespace/punctuation

    // Get initial consonants (초성) for Hangul syllables
    function getChosung(text) {
      const chosungMap = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
      let result = '';
      for (let char of text) {
        const code = char.charCodeAt(0);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          const index = (code - 0xAC00) / 588 | 0;
          result += chosungMap[index];
        } else {
          result += char.toLowerCase();
        }
      }
      return result;
    }
