name: 월간 상품 업데이트

on:
  schedule:
    - cron: '0 0 1 * *'      # 매월 1일 오전 9시(한국시간)
  workflow_dispatch: {}       # Actions 탭에서 'Run workflow'로 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow cryptography
      - name: 국군복지포털에서 상품 수집 후 암호화
        env:
          WELFARE_ID: ${{ secrets.WELFARE_ID }}
          WELFARE_PW: ${{ secrets.WELFARE_PW }}
          HM_PW: ${{ secrets.HM_PW }}
        run: python tools/update.py
      - name: 변경 사항 저장
        run: |
          git config user.name "golden-carriage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "상품 데이터 자동 업데이트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
